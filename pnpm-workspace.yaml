packages:
  - apps/*
  - packages/*

# pnpm 12 links peer-suffixed store directories to unsuffixed paths on Windows,
# which leaves dangling junctions. Disabling peer dedupe keeps the names aligned.
dedupePeerDependents: false

# pnpm blocks dependency build scripts by default. esbuild needs its postinstall
# to place the platform binary; nothing else is allowed to run scripts.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
