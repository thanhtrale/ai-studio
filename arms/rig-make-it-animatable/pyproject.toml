[project]
name = "arm-mia"
version = "0.1.0"
description = "ai-studio rig arm hosting Make-It-Animatable v2 with Blender as a library"
requires-python = ">=3.11,<3.12"
# torch 2.7 cu128, bpy 4.3, pytorch3d and torch-cluster come from their own
# indexes, installed first; see README.md.
dependencies = [
  "einops",
  "timm",
  "PyMCubes",
  "gradio>=5.50.0",
  "spaces",
  "matplotlib",
  "numpy~=1.26.4",
  "plyfile",
  "potpourri3d",
  "shapely",
  "tqdm",
  "trimesh[easy]",
  "accelerate<1.10",
  "diffusers",
  "huggingface_hub",
  "scikit-image",
  "omegaconf",
  "transformers==4.46.0",
  "pymeshlab~=2023.12.post3",
  "opencv-contrib-python",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_mia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "BLE", "RUF"]
ignore = ["RUF001", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S310"]
