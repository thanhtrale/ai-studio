[project]
name = "arm-hy3dpaint"
version = "0.1.0"
description = "ai-studio mesh arm hosting Hunyuan3D 2.1 shape generation and PBR texture painting in process"
requires-python = ">=3.12"
# torch and torchvision come from the CUDA index, installed first; see README.md.
dependencies = [
  "diffusers>=0.30",
  "transformers>=4.46,<5",
  "accelerate",
  "omegaconf",
  "einops",
  "trimesh",
  "xatlas",
  "pymeshlab",
  "opencv-python-headless",
  "scikit-image",
  "scipy",
  "safetensors",
  "spandrel",
  "pillow",
  "numpy",
  "huggingface_hub",
  "timm",
  "torchdiffeq",
  # Only for `hunyuanpaintpbr/__init__`, which imports the training wrapper.
  "pytorch-lightning",
  "pyyaml",
  "tqdm",
  "rembg",
  # 1.27 and later are built against CUDA 13; torch here is cu128, and ORT
  # borrows its CUDA and cuDNN DLLs.
  "onnxruntime-gpu>=1.26,<1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_hy3dpaint"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "BLE", "RUF"]
ignore = ["RUF001", "N818", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S310"]
