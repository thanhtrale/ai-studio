id: mesh-hunyuan3d-comfy
name: Hunyuan3D 2.1 image-to-mesh (ComfyUI)
modality: mesh
protocol: native
lifecycle: resident
capabilities:
  - mesh.generate
resources:
  gpu: exclusive
  # The 3.3B shape DiT and DINOv2 in bf16 with the VAE's octree decode on top,
  # which is the peak. BiRefNet is a few hundred megabytes and is done first.
  vramEstimateMb: 12000
launch:
  cwd: .
  # The image arm's interpreter and ComfyUI checkout, shared rather than
  # cloned. See README.md.
  command: ../image-qwen-edit-comfy/.venv/Scripts/python.exe
  args:
    - "-m"
    - "arm_hy3d"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "{{port}}"
    - "--checkpoint"
    - "{{checkpoint}}"
    - "--bg-model"
    - "{{bgModel}}"
    - "--out-dir"
    - "{{outputDir}}"
    - "--input-dir"
    - "{{inputDir}}"
    - "--scratch-dir"
    - "{{scratchDir}}"
    - "--vram-mode"
    - "{{vramMode}}"
    - "--attention"
    - "{{attention}}"
    - "--reserve-vram"
    - "{{reserveVram}}"
    - "--cache-mode"
    - "{{cacheMode}}"
    - "--extra-args"
    - "{{extraArgs}}"
  env:
    PYTHONPATH: ./src
    PYTHONUNBUFFERED: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
health:
  type: http
  path: /healthz
  timeoutMs: 60000
params: ./params.schema.json
