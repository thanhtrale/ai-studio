[project]
name = "arm-mia-st"
version = "0.1.0"
description = "ai-studio arm running the character rig pipeline (Make-It-Animatable v2 + SkinTokens) and its CPU tools"
requires-python = ">=3.11"
# The server is the standard library. The scripts it runs need the heavy
# stack -- torch, bpy, trimesh, pymeshlab, embree, cv2 -- which README.md
# installs into the same venv; SkinTokens gets a second venv of its own.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_mia_st"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
# Vendored verbatim from companion-web, where they were measured; not restyled here.
extend-exclude = ["vendor", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "BLE", "RUF"]
ignore = ["RUF001", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S310", "S603"]
