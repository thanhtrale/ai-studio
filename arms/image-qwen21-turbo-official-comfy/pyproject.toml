[project]
name = "arm-qwen21-official"
version = "0.1.0"
description = "ai-studio image arm hosting the official Qwen-Image-2.1-Turbo on a ComfyUI child process"
requires-python = ">=3.12"
# Nothing of this arm's own, and no venv of its own either: it runs on the
# image-qwen21-turbo-comfy arm's interpreter, whose ComfyUI checkout already has
# every node the graph uses. Everything the arm itself does -- HTTP in both
# directions, process supervision, log reading -- is in the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_qwen21_official"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
extend-exclude = ["vendor", "custom_nodes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "BLE", "RUF"]
ignore = [
  # "×" in a job's description is the multiplication sign on purpose: it is
  # display text that reaches the studio's timeline, not an identifier.
  "RUF001",
  # `Busy` and `ChildFailed` read as what they are at the call site, and match
  # how the other arms name the same two conditions.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S310"]
