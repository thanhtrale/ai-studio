id: image-qwen-edit-sdcpp
name: Qwen-Image-Edit 2511 (stable-diffusion.cpp)
modality: image
protocol: native
# Resident, even though stable-diffusion.cpp is best known as a one-shot CLI.
# This arm drives the project's server build instead, so the weights stay on the
# card between jobs -- which is what makes the supervisor's broker worth having:
# a second job in the same configuration is brokered in 0.0 s rather than
# re-reading twelve gigabytes.
lifecycle: resident

resources:
  gpu: exclusive
  # Measured, not estimated: four jobs on a 16376 MiB RTX 4080 peaked between
  # 13640 and 15256 MiB of whole-card use, the top of that range being a
  # 1024x576 edit with one reference image. This is the whole card rather than
  # this arm's share -- a GeForce card under Windows will not attribute memory
  # per process -- so it is the figure the supervisor should budget against.
  vramEstimateMb: 15300

launch:
  cwd: .
  # Own interpreter, like every other arm -- though this one has no third-party
  # dependencies at all. The model runs in a child process written in C++; this
  # process only translates for it.
  command: ./.venv/Scripts/python.exe
  args:
    - "-m"
    - "arm_qwen_edit"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "{{port}}"
    - "--diffusion-model"
    - "{{diffusionModel}}"
    - "--vae"
    - "{{vae}}"
    - "--llm"
    - "{{llm}}"
    - "--llm-vision"
    - "{{llmVision}}"
    # Job requests reach this arm directly rather than through the supervisor's
    # parameter resolver, so the arm needs roots of its own to confine a job's
    # paths against. These two are resolved inside storage/ for it.
    - "--out-dir"
    - "{{outputDir}}"
    - "--input-dir"
    - "{{inputDir}}"
    - "--offload-to-cpu"
    - "{{offloadToCpu}}"
    - "--flash-attention"
    - "{{flashAttention}}"
    - "--threads"
    - "{{threads}}"
    - "--model-args"
    - "{{modelArgs}}"
    - "--max-vram"
    - "{{maxVram}}"
    - "--mmap"
    - "{{mmap}}"
  env:
    PYTHONPATH: ./src
    PYTHONUNBUFFERED: "1"

health:
  type: http
  # The arm binds and answers before the child is started, so this covers
  # process start only. Reading the weights happens on the first job.
  path: /healthz
  timeoutMs: 60000

params: ./params.schema.json
