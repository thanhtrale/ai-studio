[project]
name = "arm-pixal3d"
version = "0.1.0"
description = "ai-studio mesh arm hosting Pixal3D (TencentARC) single-image to textured mesh"
requires-python = ">=3.13"
# The runtime is installed by hand (see README.md): torch 2.10 + cu130 and the
# prebuilt TRELLIS.2 CUDA wheels have to match each other exactly.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_pixal3d"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "BLE", "RUF"]
ignore = ["RUF001", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
