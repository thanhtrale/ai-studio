id: mesh-char3d-tools
name: Character pipeline tools — sheet split, colour re-projection, check renders
modality: mesh
protocol: native
lifecycle: resident
capabilities:
  - mesh.character-tools
resources:
  # CPU work: trimesh, embree, OpenCV and Blender Workbench (a few hundred MiB
  # of the card at most). Declaring none means a render after a mesh never
  # evicts the mesh arm.
  gpu: none
launch:
  # The rig arm's interpreter and its vendored scripts: the same bpy and trimesh.
  cwd: ../rig-mia-skintokens
  command: ./.venv/Scripts/python.exe
  args:
    - "-m"
    - "arm_mia_st"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "{{port}}"
    - "--role"
    - "tools"
    - "--models-dir"
    - "{{modelsDir}}"
    - "--out-dir"
    - "{{outputDir}}"
    - "--input-dir"
    - "{{inputDir}}"
  env:
    PYTHONPATH: ./src
    PYTHONUNBUFFERED: "1"
    DO_NOT_TRACK: "1"
health:
  type: http
  path: /healthz
  timeoutMs: 60000
params: ./params.schema.json
