id: mesh-pixal3d-comfy
name: Pixal3D single- and multi-view image-to-textured-mesh (ComfyUI)
modality: mesh
protocol: native
lifecycle: resident
capabilities:
  # Not mesh.generate: the job takes `views` (front/left/back/right), not one
  # `refImages` entry, and the 3D console's form would send the wrong body.
  - mesh.views
resources:
  gpu: exclusive
  # Measured on the character pipeline (RTX 5070 12 GB, multi-view bf16):
  # ~9.7 GB peak for the whole card. On a 16 GB card it stays resident.
  vramEstimateMb: 11000
launch:
  cwd: .
  # The image arm's interpreter and ComfyUI checkout, shared rather than
  # cloned -- as the TRELLIS.2 arm does. See README.md.
  command: ../image-qwen-edit-comfy/.venv/Scripts/python.exe
  args:
    - "-m"
    - "arm_pixal3d"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "{{port}}"
    - "--single-model"
    - "{{singleModel}}"
    - "--multiview-model"
    - "{{multiviewModel}}"
    - "--clip-vision"
    - "{{clipVision}}"
    - "--shape-vae"
    - "{{shapeVae}}"
    - "--texture-vae"
    - "{{textureVae}}"
    - "--bg-model"
    - "{{bgModel}}"
    - "--moge-model"
    - "{{mogeModel}}"
    - "--weight-dtype"
    - "{{weightDtype}}"
    - "--out-dir"
    - "{{outputDir}}"
    - "--input-dir"
    - "{{inputDir}}"
    - "--scratch-dir"
    - "{{scratchDir}}"
    - "--vram-mode"
    - "{{vramMode}}"
    - "--attention"
    - "{{attention}}"
    - "--reserve-vram"
    - "{{reserveVram}}"
    - "--cache-mode"
    - "{{cacheMode}}"
    - "--extra-args"
    - "{{extraArgs}}"
  env:
    PYTHONPATH: ./src
    PYTHONUNBUFFERED: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
health:
  type: http
  path: /healthz
  timeoutMs: 60000
params: ./params.schema.json
