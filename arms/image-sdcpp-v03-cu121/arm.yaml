id: image-sdcpp-v03-cu121
name: stable-diffusion.cpp v0.3 (CUDA 12.1)
modality: image
protocol: cli
# No server mode: the binary is run once per job and exits, so the GPU
# allocation is returned without the supervisor having to evict anything.
lifecycle: oneshot

resources:
  gpu: exclusive
  vramEstimateMb: 6000

launch:
  cwd: ./bin
  command: ./sd.exe
  args:
    - "-m"
    - "{{model}}"
    - "-p"
    - "{{prompt}}"
    - "-o"
    - "{{outPath}}"
    - "--steps"
    - "{{steps}}"
    - "--cfg-scale"
    - "{{cfgScale}}"
    - "--seed"
    - "{{seed}}"
    - "-W"
    - "{{width}}"
    - "-H"
    - "{{height}}"

health:
  type: none

params: ./params.schema.json
