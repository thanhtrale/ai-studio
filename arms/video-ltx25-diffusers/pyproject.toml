[project]
name = "arm-ltx25"
version = "0.1.0"
description = "ai-studio video arm hosting LTX-2.5 distilled via Hugging Face Diffusers"
requires-python = ">=3.12"
dependencies = []

# torch is installed separately so the CUDA build can be chosen per machine:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu130
[project.optional-dependencies]
runtime = [
  # LTX2Pipeline is not in a diffusers release yet.
  "diffusers @ git+https://github.com/huggingface/diffusers",
  "transformers>=5.17",
  # transformers' Gemma4Processor imports torchvision at module scope, and the
  # pipeline will not build without it even for text-to-video.
  "torchvision",
  "accelerate",
  "safetensors",
  "huggingface_hub[hf_xet]>=1.0",
  # torchao provides the fp8/int8 weight-only paths.
  "torchao>=0.18",
  # Without this, diffusers does not recognise a .gguf checkpoint and falls back
  # to torch.load, which fails on the binary with a UnicodeDecodeError.
  "gguf",
  # diffusers.utils.encode_video muxes video and audio through PyAV.
  "av",
  "pillow",
  "psutil",
]

# The diffusers dependency is a git URL, which hatchling refuses by default.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_ltx25"]
