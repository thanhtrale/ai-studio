id: image-diffusers
name: Diffusers (Python, in-process)
modality: image
protocol: native
lifecycle: resident

resources:
  gpu: exclusive
  vramEstimateMb: 10000

launch:
  cwd: .
  # Each arm owns its interpreter. The torch wheel inside this venv brings its
  # own CUDA libraries, so this arm's accelerator stack is independent of every
  # other arm's.
  command: ./.venv/Scripts/python.exe
  args:
    - "-m"
    - "arm_diffusers"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "{{port}}"
  env:
    PYTHONPATH: ./src
    PYTHONUNBUFFERED: "1"

health:
  type: http
  path: /healthz
  # Importing torch and loading a pipeline is slow on a cold filesystem cache.
  timeoutMs: 180000

params: ./params.schema.json
