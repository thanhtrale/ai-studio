[project]
name = "arm-diffusers"
version = "0.0.0"
description = "ai-studio image arm hosting Hugging Face Diffusers in-process"
requires-python = ">=3.11"
dependencies = []

# Installed separately so the CUDA build can be chosen per machine, e.g.
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
[project.optional-dependencies]
runtime = ["diffusers", "transformers", "accelerate", "safetensors", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_diffusers"]
